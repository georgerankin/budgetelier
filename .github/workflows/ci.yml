name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install flake8
        run: pip install flake8

      - name: Lint with flake8
        run: |
          # Fail only on actual errors (syntax errors, undefined names).
          # Style nitpicks are reported but won't fail the build yet.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-docker:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t budgetelier:ci .

      - name: Run container
        run: docker run -d -p 5000:5000 --name budgetelier-test budgetelier:ci

      - name: Wait for app to become ready
        run: |
          # start.sh seeds the DB before gunicorn starts serving, so poll
          # instead of assuming the container is ready immediately.
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/ -o /dev/null; then
              echo "App responded after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App did not respond in time"
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs budgetelier-test

      - name: Clean up
        if: always()
        run: docker rm -f budgetelier-test || true